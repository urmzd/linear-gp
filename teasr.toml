[output]
dir = "./showcase"

[[output.formats]]
output_type = "gif"
[[output.formats]]
output_type = "png"

[font]
family = "MonaspiceNe Nerd Font"

# Scene 1: Show available experiments
[[scenes]]
type = "terminal"
name = "list-experiments"
theme = "dracula"
cwd = "."
cols = 64
rows = 12

[[scenes.interactions]]
type = "type"
text = "export PS1='$ ' PATH=\"$PWD/target/release:$PATH\" RUST_LOG=error && clear"
speed = 1
[[scenes.interactions]]
type = "key"
key = "enter"
[[scenes.interactions]]
type = "wait"
duration = 500
[[scenes.interactions]]
type = "type"
text = "lgp list"
speed = 50
[[scenes.interactions]]
type = "key"
key = "enter"
[[scenes.interactions]]
type = "wait"
duration = 3000

# Scene 2: Run a quick Iris experiment and show the final row (generation, max, mean, median, min fitness)
[[scenes]]
type = "terminal"
name = "run-experiment"
theme = "dracula"
cwd = "."
cols = 80
rows = 15

[[scenes.interactions]]
type = "type"
text = "export PS1='$ ' PATH=\"$PWD/target/release:$PATH\" RUST_LOG=error && clear"
speed = 1
[[scenes.interactions]]
type = "key"
key = "enter"
[[scenes.interactions]]
type = "wait"
duration = 500
[[scenes.interactions]]
type = "type"
text = "lgp run iris_crossover && lgp analyze && tail -n1 outputs/tables/*.csv"
speed = 30
[[scenes.interactions]]
type = "key"
key = "enter"
[[scenes.interactions]]
type = "wait"
duration = 30000
